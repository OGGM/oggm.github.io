name: Logo Rotation PR Bot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD date override for testing"
        required: false
        type: string

jobs:
  rotate-website:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.cpr.outputs.pull-request-url }}
      pr_op: ${{ steps.cpr.outputs.pull-request-operation }}
      event: ${{ steps.logo.outputs.event_name }}
      window: ${{ steps.logo.outputs.window }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/logo-bot/requirements.txt

      - name: Compute active logo and update config
        id: logo
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          args=(--target website)
          if [[ -n "${INPUT_DATE}" ]]; then
            args+=(--today "${INPUT_DATE}")
          fi
          python .github/logo-bot/update_logo.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        if: steps.logo.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.logo.outputs.branch }}
          title: ${{ steps.logo.outputs.pr_title }}
          commit-message: ${{ steps.logo.outputs.commit_message }}
          body: |
            Automated logo rotation update for **oggm.github.io**.

            - Date: ${{ steps.logo.outputs.today }}
            - Event: ${{ steps.logo.outputs.event_name }}
            - Window: ${{ steps.logo.outputs.window }}
            - New logo: ${{ steps.logo.outputs.desired_logo }}
            - Event URL: ${{ steps.logo.outputs.event_url }}
            - Previous logo: ${{ steps.logo.outputs.current_logo }}
            - Previous event URL: ${{ steps.logo.outputs.current_event_url }}

            This PR was generated by `.github/workflows/logo-rotation-pr.yml`.
          add-paths: |
            _config.yml
          labels: |
            automation
            website

  rotate-docs:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.cpr.outputs.pull-request-url }}
      pr_op: ${{ steps.cpr.outputs.pull-request-operation }}
      event: ${{ steps.logo.outputs.event_name }}
      window: ${{ steps.logo.outputs.window }}
    permissions:
      contents: read

    steps:
      - name: Checkout this repo (for the script)
        uses: actions/checkout@v6

      - name: Checkout OGGM/oggm stable
        uses: actions/checkout@v6
        with:
          repository: OGGM/oggm
          ref: stable
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: _target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/logo-bot/requirements.txt

      - name: Compute active logo and update config
        id: logo
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          args=(--target docs --workdir _target)
          if [[ -n "${INPUT_DATE}" ]]; then
            args+=(--today "${INPUT_DATE}")
          fi
          python .github/logo-bot/update_logo.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        if: steps.logo.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: _target
          branch: ${{ steps.logo.outputs.branch }}
          title: ${{ steps.logo.outputs.pr_title }}
          commit-message: ${{ steps.logo.outputs.commit_message }}
          body: |
            Automated logo rotation update for **docs.oggm.org** (OGGM/oggm stable).

            - Date: ${{ steps.logo.outputs.today }}
            - Event: ${{ steps.logo.outputs.event_name }}
            - Window: ${{ steps.logo.outputs.window }}
            - New logo: ${{ steps.logo.outputs.desired_logo }}
            - Event URL: ${{ steps.logo.outputs.event_url }}
            - Previous logo: ${{ steps.logo.outputs.current_logo }}

            This PR was generated by `OGGM/oggm.github.io/.github/workflows/logo-rotation-pr.yml`.
          add-paths: |
            docs/conf.py
          labels: |
            automation

  rotate-tutorials:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.cpr.outputs.pull-request-url }}
      pr_op: ${{ steps.cpr.outputs.pull-request-operation }}
      event: ${{ steps.logo.outputs.event_name }}
      window: ${{ steps.logo.outputs.window }}
    permissions:
      contents: read

    steps:
      - name: Checkout this repo (for the script)
        uses: actions/checkout@v6

      - name: Checkout OGGM/tutorials stable
        uses: actions/checkout@v6
        with:
          repository: OGGM/tutorials
          ref: stable
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: _target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/logo-bot/requirements.txt

      - name: Compute active logo and update config
        id: logo
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          args=(--target tutorials --workdir _target)
          if [[ -n "${INPUT_DATE}" ]]; then
            args+=(--today "${INPUT_DATE}")
          fi
          python .github/logo-bot/update_logo.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        if: steps.logo.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: _target
          branch: ${{ steps.logo.outputs.branch }}
          title: ${{ steps.logo.outputs.pr_title }}
          commit-message: ${{ steps.logo.outputs.commit_message }}
          body: |
            Automated logo rotation update for **OGGM/tutorials** (stable branch).

            - Date: ${{ steps.logo.outputs.today }}
            - Event: ${{ steps.logo.outputs.event_name }}
            - Window: ${{ steps.logo.outputs.window }}
            - New logo: ${{ steps.logo.outputs.desired_logo }}
            - Event URL: ${{ steps.logo.outputs.event_url }}
            - Previous logo: ${{ steps.logo.outputs.current_logo }}

            This PR was generated by `OGGM/oggm.github.io/.github/workflows/logo-rotation-pr.yml`.
          add-paths: |
            _config.yml
          labels: |
            automation

  # PRs in OGGM/oggm and OGGM/tutorials are opened with a personal token, and
  # GitHub does not notify people about their own actions. This job opens an
  # issue as github-actions[bot] that mentions the maintainers, so they get
  # notified when a PR needs merging or when a job fails.
  notify:
    needs: [rotate-website, rotate-docs, rotate-tutorials]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open issue pinging maintainers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTIFY: "@fmaussion @pat-schmitt"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_DATE: ${{ inputs.date }}
          EVENT: ${{ needs.rotate-website.outputs.event || needs.rotate-docs.outputs.event || needs.rotate-tutorials.outputs.event }}
          WINDOW: ${{ needs.rotate-website.outputs.window || needs.rotate-docs.outputs.window || needs.rotate-tutorials.outputs.window }}
          WEB_RESULT: ${{ needs.rotate-website.result }}
          WEB_URL: ${{ needs.rotate-website.outputs.pr_url }}
          WEB_OP: ${{ needs.rotate-website.outputs.pr_op }}
          DOCS_RESULT: ${{ needs.rotate-docs.result }}
          DOCS_URL: ${{ needs.rotate-docs.outputs.pr_url }}
          DOCS_OP: ${{ needs.rotate-docs.outputs.pr_op }}
          TUT_RESULT: ${{ needs.rotate-tutorials.result }}
          TUT_URL: ${{ needs.rotate-tutorials.outputs.pr_url }}
          TUT_OP: ${{ needs.rotate-tutorials.outputs.pr_op }}
        run: |
          set -euo pipefail
          today="${INPUT_DATE:-$(date -u +%F)}"
          created=false
          failed=false
          lines=""

          add() {
            local name=$1 result=$2 url=$3 op=$4
            if [[ "$result" != "success" ]]; then
              failed=true
              lines+="- **${name}**: job ${result}"$'\n'
            elif [[ -n "$url" ]]; then
              if [[ "$op" == "created" ]]; then created=true; fi
              lines+="- **${name}**: ${url} (${op:-unknown})"$'\n'
            else
              lines+="- **${name}**: nothing to change"$'\n'
            fi
          }
          add "oggm.github.io" "$WEB_RESULT" "$WEB_URL" "$WEB_OP"
          add "docs (OGGM/oggm)" "$DOCS_RESULT" "$DOCS_URL" "$DOCS_OP"
          add "tutorials (OGGM/tutorials)" "$TUT_RESULT" "$TUT_URL" "$TUT_OP"

          if [[ "$created" != "true" && "$failed" != "true" ]]; then
            echo "No new PR and no failure: nothing to ping about."
            exit 0
          fi

          if [[ "$failed" == "true" ]]; then
            title="Logo rotation bot failed"
            # Don't open a new issue every day while the same failure persists.
            open=$(gh issue list --state open --label automation \
                     --search "in:title \"${title}\"" --json number --jq length)
            if [[ "$open" != "0" ]]; then
              echo "A failure issue is already open, not opening another one."
              exit 0
            fi
            title="${title} (${today})"
            intro="the logo rotation bot failed. See the [workflow run](${RUN_URL})."
          else
            title="Logo rotation: ${EVENT} (${today})"
            intro="the logo rotation bot opened PRs that need merging."
          fi

          body="${NOTIFY} ${intro}

          - Event: **${EVENT:-unknown}**
          - Window: ${WINDOW:-unknown}

          ${lines}
          Please close this issue once everything is merged.
          This issue was opened by \`.github/workflows/logo-rotation-pr.yml\`."

          gh issue create --title "$title" --body "$body" --label automation
